name: Workday Extend WDCLI CI/CD

on:
  push:
    branches: [main]
    paths:
      - "**/appManifest.json"
      - "**/attributes/**"
      - "**/cards/**"
      - "**/model/**"
      - "**/orchestration/**"
      - "**/presentation/**"
  workflow_dispatch:
    inputs:
      upload_to_apphub:
        description: Upload the validated source to Workday App Hub and create a build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# WDCLI stores authentication locally. Do not allow concurrent jobs to share it.
# Pull-request execution is intentionally disabled while a saved developer-user
# session is used on the runner.
concurrency:
  group: workday-extend-wdcli
  cancel-in-progress: false

env:
  WORKDAY_APP_DIR: ${{ vars.WORKDAY_APP_DIR || '.' }}
  WDCLI_ACCOUNT: ${{ vars.WDCLI_ACCOUNT }}
  EXPECTED_WDCLI_VERSION: ${{ vars.EXPECTED_WDCLI_VERSION || '1.8.43' }}

jobs:
  validate_and_package:
    name: Validate and package
    runs-on: [self-hosted, windows, x64, workday-wdcli, workday-developer-session]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve and verify app source
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WDCLI_ACCOUNT)) {
            throw "Configure the WDCLI_ACCOUNT repository variable with the Workday account short ID."
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $appDirectory = [IO.Path]::GetFullPath(
            (Join-Path $workspace $env:WORKDAY_APP_DIR)
          )

          if (-not $appDirectory.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) {
            throw "WORKDAY_APP_DIR must resolve inside the checked-out repository."
          }

          $manifestPath = Join-Path $appDirectory "appManifest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Workday app manifest was not found: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.referenceId)) {
            throw "appManifest.json does not contain a referenceId."
          }

          "RESOLVED_APP_DIR=$appDirectory" >> $env:GITHUB_ENV
          "APP_REFERENCE_ID=$($manifest.referenceId)" >> $env:GITHUB_ENV

      - name: Verify WDCLI
        run: |
          $versionOutput = (wdcli version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "WDCLI is not installed or is not available on PATH."
          }

          $versionOutput
          if ($versionOutput -notmatch [regex]::Escape($env:EXPECTED_WDCLI_VERSION)) {
            throw "Expected WDCLI $env:EXPECTED_WDCLI_VERSION but found: $versionOutput"
          }

      - name: Check JSON-based Workday source
        run: |
          $jsonExtensions = @(
            ".json", ".attributes", ".businessobject", ".businessprocess",
            ".card", ".carddefinition", ".graphquery", ".mock_config",
            ".mock_response", ".orchestration", ".pmd", ".securitydomain",
            ".smd", ".amd", ".task", ".wqlquery"
          )

          $invalidFiles = @()
          Get-ChildItem -LiteralPath $env:RESOLVED_APP_DIR -Recurse -File |
            Where-Object { $jsonExtensions -contains $_.Extension } |
            ForEach-Object {
              try {
                $null = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
              } catch {
                $invalidFiles += $_.FullName
              }
            }

          if ($invalidFiles.Count -gt 0) {
            throw "Invalid JSON-based Workday files:`n$($invalidFiles -join "`n")"
          }

      - name: Verify pre-authenticated Developer Site session
        run: |
          wdcli account switch $env:WDCLI_ACCOUNT --ci --format json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The saved Developer Site session cannot access account $env:WDCLI_ACCOUNT. Log in interactively on the runner with 'wdcli auth login'."
          }

          $identityOutput = wdcli whoami --ci --format json | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "No valid Developer Site session is available to the runner. Log in interactively on the runner with 'wdcli auth login'."
          }

          $identity = $identityOutput | ConvertFrom-Json
          if ($identity.organizationShortId -ne $env:WDCLI_ACCOUNT) {
            throw "WDCLI is authenticated to $($identity.organizationShortId), not $env:WDCLI_ACCOUNT."
          }

          "Authenticated as $($identity.user) for $($identity.organizationName) ($($identity.organizationShortId))."

      - name: Run Workday validation
        run: |
          wdcli app validate `
            --directory $env:RESOLVED_APP_DIR `
            --account $env:WDCLI_ACCOUNT `
            --ci `
            --format json

          if ($LASTEXITCODE -ne 0) {
            throw "Workday app validation failed."
          }

      - name: Build upload archive without uploading
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "$env:APP_REFERENCE_ID-$env:GITHUB_SHA.zip"

          wdcli app upload $env:RESOLVED_APP_DIR `
            --dry-run `
            --output $archivePath `
            --account $env:WDCLI_ACCOUNT `
            --ci

          if ($LASTEXITCODE -ne 0) {
            throw "WDCLI could not package the app."
          }

          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          "### Workday CI validation passed" >> $env:GITHUB_STEP_SUMMARY
          "- App: ``$env:APP_REFERENCE_ID``" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Package SHA-256: ``$archiveHash``" >> $env:GITHUB_STEP_SUMMARY
          "- No source was uploaded and no tenant was changed." >> $env:GITHUB_STEP_SUMMARY

  upload_to_apphub:
    name: Upload and build in App Hub
    needs: validate_and_package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.upload_to_apphub == true &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, workday-wdcli, workday-developer-session]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve app source
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $appDirectory = [IO.Path]::GetFullPath(
            (Join-Path $workspace $env:WORKDAY_APP_DIR)
          )
          $manifestPath = Join-Path $appDirectory "appManifest.json"

          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Workday app manifest was not found: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          "RESOLVED_APP_DIR=$appDirectory" >> $env:GITHUB_ENV
          "APP_REFERENCE_ID=$($manifest.referenceId)" >> $env:GITHUB_ENV

      - name: Verify WDCLI
        run: |
          $versionOutput = (wdcli version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $versionOutput -notmatch [regex]::Escape($env:EXPECTED_WDCLI_VERSION)) {
            throw "Expected WDCLI $env:EXPECTED_WDCLI_VERSION but found: $versionOutput"
          }

      - name: Verify pre-authenticated Developer Site session
        run: |
          wdcli account switch $env:WDCLI_ACCOUNT --ci --format json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The saved Developer Site session cannot access account $env:WDCLI_ACCOUNT."
          }

          $identityOutput = wdcli whoami --ci --format json | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "No valid Developer Site session is available to the runner."
          }

          $identity = $identityOutput | ConvertFrom-Json
          if ($identity.organizationShortId -ne $env:WDCLI_ACCOUNT) {
            throw "WDCLI is authenticated to $($identity.organizationShortId), not $env:WDCLI_ACCOUNT."
          }

          "Authenticated as $($identity.user) for $($identity.organizationName) ($($identity.organizationShortId))."

      - name: Upload source and wait for App Hub build
        run: |
          wdcli app upload $env:RESOLVED_APP_DIR `
            --account $env:WDCLI_ACCOUNT `
            --ci `
            --format json

          if ($LASTEXITCODE -ne 0) {
            throw "App Hub upload or build failed."
          }

      - name: Show resulting App Hub versions
        run: |
          wdcli app versions $env:APP_REFERENCE_ID `
            --account $env:WDCLI_ACCOUNT `
            --ci `
            --format json

          "### Workday App Hub build completed" >> $env:GITHUB_STEP_SUMMARY
          "- App: ``$env:APP_REFERENCE_ID``" >> $env:GITHUB_STEP_SUMMARY
          "- No Workday tenant deployment was performed." >> $env:GITHUB_STEP_SUMMARY
