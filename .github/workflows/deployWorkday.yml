# .github/workflows/deploy-to-dev.yml
name: Deploy App to Workday Dev Tenant

on:
  push:
    branches:
      - main # Triggers the workflow automatically on commits or merges to the main branch
  workflow_dispatch: # Allows you to trigger this deployment manually from the GitHub Actions tab

jobs:
  deploy-workday-app:
    name: Build and Deploy to Workday Dev Environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Fetch single commit for speed and efficiency

      # Step 2: Set up Node.js environment (needed for the WDCLI execution environment)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install the Workday CLI (WDCLI)
      - name: Install Workday CLI
        run: |
          echo "Installing Workday CLI globally..."
          # Install the official Workday CLI package globally
          npm install -g @workday/cli
          
          # Verify installation path and command availability
          wd --version

      # Step 4: Programmatically Authenticate with Workday using System User Credentials
      # This utilizes GitHub Secrets to perform a secure, non-interactive login
      - name: Authenticate to Workday
        env:
          WD_CLIENT_ID: ${{ secrets.WD_CLIENT_ID }}
          WD_CLIENT_SECRET: ${{ secrets.WD_CLIENT_SECRET }}
        run: |
          echo "Authenticating programmatically via WDCLI..."
          # Authenticate using the client credentials of your configured System User
          wd auth login \
            --client-id "$WD_CLIENT_ID" \
            --client-secret "$WD_CLIENT_SECRET" \
            --non-interactive

      # Step 5: Deploy the App to your Workday Developer Tenant
      - name: Deploy App to Workday
        env:
          WD_TENANT_ALIAS: ${{ secrets.WD_TENANT_ALIAS }}
          WD_ACCOUNT: ${{ secrets.WD_ACCOUNT }}
        run: |
          echo "Initiating app deployment..."
          # Deploy the Workday App using the active session and required target variables.
          # Note: The CLI reads your local 'app-manifest.json' automatically to determine the app identity.
          wd app deploy \
            --tenant-alias "$WD_TENANT_ALIAS" \
            --account "$WD_ACCOUNT" \
            --non-interactive

      # Step 6: Secure Logout to clear active sessions on the runner
      # This step ALWAYS runs, even if the deployment fails, to prevent token leakage
      - name: Secure Logout
        if: always()
        run: |
          echo "Logging out and clearing active CLI session..."
          wd auth logout
