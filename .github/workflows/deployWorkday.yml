name: Deploy App to Workday

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  WDCLI_CLIENT_ID: ${{ secrets.WDCLI_CLIENT_ID }}
  WDCLI_CLIENT_SECRET: ${{ secrets.WDCLI_CLIENT_SECRET }}
  WDCLI_TENANT_CLIENT_ID: ${{ secrets.WDCLI_TENANT_CLIENT_ID }}
  WDCLI_TENANT_CLIENT_SECRET: ${{ secrets.WDCLI_TENANT_CLIENT_SECRET }}

  # Update these values
  WDCLI_TENANT_ALIAS: orgname_wcpdev1
  WDCLI_APP_REFERENCE_ID: PG_testApp_xxxxxx

jobs:
  deploy:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and configure WDCLI
        run: |
          # Update this filename to match the Windows WDCLI package
          $archive = "wdcli-installer-windows-x64-v1.7.25.zip"

          if (-not (Test-Path -LiteralPath $archive)) {
            throw "WDCLI archive was not found: $archive"
          }

          Expand-Archive `
            -LiteralPath $archive `
            -DestinationPath "$PWD\wdcli" `
            -Force

          # Update this path if the archive has a different directory structure
          $wdcliBin = "$PWD\wdcli\bin"
          $wdcliExecutable = Join-Path $wdcliBin "wdcli.exe"

          if (-not (Test-Path -LiteralPath $wdcliExecutable)) {
            throw "WDCLI executable was not found: $wdcliExecutable"
          }

          $wdcliBin >> $env:GITHUB_PATH

      - name: Authenticate with Workday system user
        run: |
          wdcli auth login --system-user

      - name: Upload app
        run: |
          $appPath = "apps\$env:WDCLI_APP_REFERENCE_ID"

          if (-not (Test-Path -LiteralPath $appPath)) {
            throw "Application directory was not found: $appPath"
          }

          wdcli app upload $appPath --ci

      - name: Get tenant access token
        id: token
        run: |
          $credentialPair = "{0}:{1}" -f `
            $env:WDCLI_TENANT_CLIENT_ID, `
            $env:WDCLI_TENANT_CLIENT_SECRET

          $credentialBytes = [Text.Encoding]::UTF8.GetBytes($credentialPair)
          $credentials = [Convert]::ToBase64String($credentialBytes)

          $headers = @{
            Authorization = "Basic $credentials"
          }

          $body = @{
            grant_type  = "client_credentials"
            tenant_alias = $env:WDCLI_TENANT_ALIAS
          }

          $response = Invoke-RestMethod `
            -Method Post `
            -Uri "https://auth.api.workday.com/v1/token" `
            -Headers $headers `
            -ContentType "application/x-www-form-urlencoded" `
            -Body $body

          $accessToken = $response.access_token

          if ([string]::IsNullOrWhiteSpace($accessToken)) {
            throw "Workday authentication did not return an access token."
          }

          # Prevent accidental token disclosure in subsequent logs
          Write-Output "::add-mask::$accessToken"
          "access_token=$accessToken" >> $env:GITHUB_OUTPUT

      - name: Configure tenant access
        env:
          TENANT_ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          wdcli config set defaultTenantAlias $env:WDCLI_TENANT_ALIAS
          wdcli config set wcpTenantAccessToken $env:TENANT_ACCESS_TOKEN

      - name: Deploy latest app version
        run: |
          wdcli app deploy `
            $env:WDCLI_APP_REFERENCE_ID `
            --latest-version `
            --ci `
            -t $env:WDCLI_TENANT_ALIAS
